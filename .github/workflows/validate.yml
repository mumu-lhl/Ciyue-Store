name: Validate Catalog

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv & Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.15"

      - name: Run validator unit tests
        run: uv run --with pyyaml python -m unittest discover -s scripts -p "test_*.py" -v

      - name: Validate catalog.yaml
        run: uv run --with pyyaml python scripts/validate_catalog.py catalog.yaml
