name: Sync dev to main

on:
  schedule:
    # Daily at 00:00 UTC+8 (16:00 UTC)
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check if dev has new commits for main
        id: check
        run: |
          git fetch origin dev main
          if git merge-base --is-ancestor origin/dev origin/main; then
            echo "ahead=false" >> "$GITHUB_OUTPUT"
            echo "main is already up to date with dev."
          else
            echo "ahead=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up uv & Python
        if: steps.check.outputs.ahead == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.15"

      - name: Validate dev catalog before syncing
        if: steps.check.outputs.ahead == 'true'
        run: |
          git checkout origin/dev
          uv run --with pyyaml python -m unittest discover -s scripts -p "test_*.py" -v
          uv run --with pyyaml python scripts/validate_catalog.py catalog.yaml

      - name: Create or update dev -> main PR
        if: steps.check.outputs.ahead == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number=$(gh pr list --base main --head dev --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr_number" ]; then
            pr_url=$(gh pr create \
              --base main \
              --head dev \
              --title "chore: sync dev to main" \
              --body "Automated sync from \`dev\` to \`main\` after catalog validation passed.")
            pr_number="${pr_url##*/}"
          fi
          gh pr merge "$pr_number" --auto --merge || echo "Auto-merge not enabled or awaiting checks/reviews for PR #$pr_number."
